packages:
  - packages/*
  - fixtures/*

# One version per dependency across packages and fixtures.
catalog:
  # Pinned to 6.x: TypeScript 7 (native compiler) has no stable JS API yet,
  # which tsup's .d.ts build needs. The scanner uses ts-morph's bundled compiler.
  typescript: 6.0.3
  "@types/node": ^22.19.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@biomejs/biome": 2.6.3
  vitest: ^5.0.5
  "@playwright/test": ^1.64.1
  tsup: ^9.0.0
  vite: ^8.3.5
  "@vitejs/plugin-react": ^6.1.2
  react: ^19.3.1
  react-dom: ^19.3.1
  next: 16.4.3
  zod: ^4.6.7
  axios: ^1.20.0
  "@tanstack/react-query": ^5.105.0
  swr: ^2.5.1
  next-intl: ^4.14.9
  ts-morph: ^28.0.0
  hono: ^4.13.0
  "@hono/node-server": ^2.1.0
  "@jridgewell/trace-mapping": ^0.3.31
  "@xyflow/react": ^12.12.0

# pnpm 11 blocks dependency install scripts unless listed here.
allowBuilds:
  esbuild: true
  # Both ship prebuilt binaries as optional deps; their scripts only build from source.
  "@swc/core": false
  "@parcel/watcher": false
