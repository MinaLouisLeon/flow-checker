$kind: http-example
request:
  url: "{{baseUrl}}/users"
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      [
        { "id": 1, "name": "Ada Lovelace", "email": "ada@example.com", "role": "admin" },
        { "id": 2, "name": "Alan Turing", "email": "alan@example.com", "role": "member" }
      ]
